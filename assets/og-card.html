<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>free forever — share card source</title>
<!-- Source for assets/og-card.png. Screenshot it at exactly 1200x630:
       node scripts/make-cards.mjs
     The counts between the markers are rewritten by scripts/build-static.mjs,
     so the card cannot drift from data/tools.js. The palette mirrors
     assets/style.css: near-black ground, mono for anything measured. -->
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --bg: #0a0c0b;
    --line: #212825;
    --ink: #e9ede4;
    --ink-2: #a9b2a7;
    --ink-3: #7c877e;
    --green: #46e08c;
    --green-dim: #0f2e1d;
    --amber: #f2b544;
    --grey: #a2b0c2;
    --display: "Bricolage Grotesque", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 400 22px/1.45 var(--sans);
    padding: 62px 68px 54px; box-sizing: border-box;
    display: flex; flex-direction: column;
    /* the same hairline grid the page uses, at 4% so it never fights the type */
    background-image:
      linear-gradient(90deg, rgba(233,237,228,.05) 1px, transparent 1px),
      linear-gradient(180deg, rgba(233,237,228,.05) 1px, transparent 1px);
    background-size: 68px 68px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font: 500 15px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
    color: var(--green);
  }
  .eyebrow::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(70,224,140,.18);
  }
  h1 {
    font: 700 104px/.92 var(--display); letter-spacing: -.045em;
    margin: 30px 0 0; max-width: 940px;
  }
  h1 em { font-style: normal; display: block; color: var(--green); }
  p.sub {
    font: 400 25px/1.4 var(--sans); color: var(--ink-2);
    margin: 26px 0 0; max-width: 800px;
  }
  .rule { flex: 1 1 auto; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .foot { display: flex; align-items: flex-end; gap: 0; }
  .stats { display: flex; }
  .stat { padding: 0 42px; border-left: 1px solid var(--line); }
  .stat:first-child { padding-left: 0; border-left: 0; }
  .stat b {
    display: block;
    font: 600 58px/.95 var(--mono); letter-spacing: -.05em;
    font-variant-numeric: tabular-nums;
  }
  .stat span {
    display: block; margin-top: 11px;
    font: 500 13px/1 var(--mono); letter-spacing: .15em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .stat--forever b { color: var(--green); }
  .stat--limited b { color: var(--amber); }
  .stat--reference b { color: var(--grey); }
  .mark {
    margin-left: auto; align-self: flex-end;
    font: 500 14px/1 var(--mono); letter-spacing: .08em; color: var(--ink-3);
  }
</style>
</head>
<body>
  <span class="eyebrow" id="card-eyebrow">free forever · 42 tools</span>
  <h1>Free, or just <em>free for now?</em></h1>
  <p class="sub">Which AI coding tools are actually free, and which are only a trial — with the catch printed under every row.</p>
  <div class="rule"></div>
  <div class="foot">
    <!--count:stats-->
      <div class="stats">
        <div class="stat stat--forever"><b>13</b><span>Free forever</span></div>
        <div class="stat stat--limited"><b>24</b><span>Limited free</span></div>
        <div class="stat stat--reference"><b>5</b><span>Reference</span></div>
      </div>
    <!--/count:stats-->
    <span class="mark">e4crypt3d.github.io/free-forever</span>
  </div>
</body>
</html>
