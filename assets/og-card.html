<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>free forever, share card source</title>
<!-- Source for assets/og-card.png. Screenshot it at exactly 1200x630:
       node scripts/make-cards.mjs
     The counts between the markers are rewritten by scripts/build-static.mjs,
     so the card cannot drift from data/tools.js. The palette mirrors
     assets/style.css: white surfaces, ink type, colour only for the tiers. -->
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --line: #e4e7ec;
    --ink: #12151b;
    --ink-2: #4b5462;
    --ink-3: #636c79;
    --forever-bg: #e7f4ec;
    --forever-tx: #0b6b43;
    --limited-bg: #fdf3e3;
    --limited-tx: #8a5300;
    --ref-bg: #eef1f6;
    --ref-tx: #495366;
    --display: "Bricolage Grotesque", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 400 22px/1.45 var(--sans);
    padding: 44px 56px;
    box-sizing: border-box;
    display: flex; flex-direction: column;
  }
  .card {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 52px 56px 44px;
  }
  .top { display: flex; align-items: center; gap: 12px; }
  .mark-box {
    display: grid; place-items: center;
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--ink); color: #fff;
    font: 600 16px/1 var(--mono);
  }
  .brand { font: 700 26px/1 var(--display); letter-spacing: -.02em; }
  .eyebrow {
    margin-left: auto;
    font: 500 14px/1 var(--mono);
    letter-spacing: .04em;
    color: var(--ink-3);
  }
  h1 {
    font: 700 88px/.98 var(--display);
    letter-spacing: -.04em;
    margin: 44px 0 0;
    max-width: 940px;
  }
  h1 em { font-style: normal; color: var(--ink-3); }
  p.sub {
    font: 400 24px/1.4 var(--sans);
    color: var(--ink-2);
    margin: 26px 0 0;
    max-width: 830px;
  }
  .rule { flex: 1 1 auto; }
  .foot { display: flex; align-items: flex-end; gap: 24px; }
  .stats { display: flex; gap: 10px; }
  .stat {
    display: flex; align-items: baseline; gap: 9px;
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .stat b {
    font: 600 21px/1 var(--display);
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .stat span { font: 500 15px/1 var(--sans); }
  .stat--forever { background: var(--forever-bg); border-color: #c7e6d5; color: var(--forever-tx); }
  .stat--limited { background: var(--limited-bg); border-color: #f0dcc0; color: var(--limited-tx); }
  .stat--reference { background: var(--ref-bg); border-color: #dbe1ea; color: var(--ref-tx); }
  .url {
    margin-left: auto;
    font: 400 15px/1 var(--mono);
    color: var(--ink-3);
    padding-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="mark-box">$0</span>
      <span class="brand">free forever</span>
      <span class="eyebrow" id="card-eyebrow">free forever · 42 tools</span>
    </div>
    <h1>Free, or just <em>free for now?</em></h1>
    <p class="sub">Which AI coding tools are actually free, and which are only a trial, with the catch printed under every row.</p>
    <div class="rule"></div>
    <div class="foot">
      <!--count:stats-->
      <div class="stats">
        <div class="stat stat--forever"><b>13</b><span>Free forever</span></div>
        <div class="stat stat--limited"><b>24</b><span>Limited free</span></div>
        <div class="stat stat--reference"><b>5</b><span>Reference</span></div>
      </div>
    <!--/count:stats-->
      <span class="url">e4crypt3d.github.io/free-forever</span>
    </div>
  </div>
</body>
</html>
